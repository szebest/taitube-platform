packages:
  - 'apps/*/*'
  - 'packages/*/*'
  - 'tools/*'
allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  lefthook: false
  msgpackr-extract: false
  protobufjs: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vitest: 5.1.0
  vite-plus: 1.5.0
  '@vitest/coverage-v8': 5.1.0
  '@vitest/browser-playwright': 5.1.0
overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
