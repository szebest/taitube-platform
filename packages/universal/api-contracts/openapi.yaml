  /v1/playlists/{id}/reorder:
    put:
      summary: Reorder a playlist
      tags:
        - Playlists
      description: Moves one item to a new place, or puts the items the caller can see in the order given; a video hidden from them keeps its slot. A full order that misses or repeats a visible item was drawn from a stale view and answers 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - type: object
                  properties:
                    itemId:
                      type: string
                      format: uuid
                    newPosition:
                      type: integer
                      minimum: 0
                      description: Target place; past the end means last
                  required:
                    - itemId
                    - newPosition
                  additionalProperties: false
                - type: object
                  properties:
                    itemIds:
                      type: array
                      items:
                        type: string
                        format: uuid
                      description: Every item id the caller sees in the playlist, in the new order
                  required:
                    - itemIds
                  additionalProperties: false
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  ownerId:
                    type: string
                    format: uuid
                  title:
                    type: string
                  description:
                    type: string
                  visibility:
                    type: string
                    enum:
                      - private
                      - unlisted
                      - public
                    description: 'public: listed and searchable; unlisted: anyone with the link; private: the owner'
                  isSystem:
                    type: boolean
                    description: 'Watch Later: cannot be renamed or deleted'
                  thumbnailUrl:
                    type: string
                    nullable: true
