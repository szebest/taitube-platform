  /v1/creator/channel/analytics:
    get:
      summary: Views across the caller's channel
      tags:
        - Creator Analytics
      description: Aggregated daily views, total views, daily velocity and the top videos over every video the caller owns.
      parameters:
        - schema:
            type: string
            enum:
              - 7d
              - 30d
              - 90d
            default: 30d
          in: query
          name: range
          required: false
          description: How many days back the timeline reaches, today included
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalViews:
                    type: integer
                    minimum: 0
                    description: Views of every video the caller owns
                  videoCount:
                    type: integer
                    minimum: 0
                    description: Videos the caller owns
                  dailyVelocity:
                    type: number
                    minimum: 0
                    description: Range views divided by the days in it
                  topVideos:
                    type: array
                    items:
                      type: object
                      properties:
                        videoId:
                          type: string
                          format: uuid
                          description: Video UUID identifier
                        title:
                          type: string
                          description: Video title
                        views:
                          type: integer
                          minimum: 0
