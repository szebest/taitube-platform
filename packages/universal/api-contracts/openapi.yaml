  /v1/videos:
    get:
      summary: List caller videos with keyset pagination
      tags:
        - Videos
      description: Keyset-paginated on (created_at, id), stable under concurrent inserts, scoped to the caller. nextCursor is opaque base64url.
      parameters:
        - schema:
            type: string
          in: query
          name: cursor
          required: false
          description: Opaque base64url keyset pagination cursor
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          in: query
          name: limit
          required: false
          description: 'Page size limit (1-100, default 20). A deployment with a lower PAGE_SIZE_MAX clamps rather than rejects: the page comes back shorter than asked for and nextCursor walks the remainder.'
        - schema:
            type: string
            enum:
              - UPLOADING
              - UPLOADED
              - PROBING
              - PROCESSING
              - READY
              - FAILED
              - REJECTED
              - ABANDONED
              - DELETED
          in: query
          name: status
          required: false
          description: Filter videos by pipeline status
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: Video UUIDv7 identifier
                        ownerId:
                          type: string
                          format: uuid
                          description: Owning user UUID, for client-side ownership rules
                        title:
                          type: string
                          nullable: true
                          description: Video title
                        description:
                          type: string
                          nullable: true
                          description: Video description
