  /v1/creator/videos/{id}/analytics:
    get:
      summary: Views timeline and summary of one owned video
      tags:
        - Creator Analytics
      description: Daily views, total views and average retention of a video the caller owns. Views reach it within one flush interval of being counted.
      parameters:
        - schema:
            type: string
            enum:
              - 7d
              - 30d
              - 90d
            default: 30d
          in: query
          name: range
          required: false
          description: How many days back the timeline reaches, today included
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  videoId:
                    type: string
                    format: uuid
                    description: Video UUID identifier
                  totalViews:
                    type: integer
                    minimum: 0
                    description: Views counted since the video was made
                  averageDailyViews:
                    type: number
                    minimum: 0
                    description: Range views divided by the days in it
                  averageRetention:
                    type: number
                    minimum: 0
                    maximum: 1
                    nullable: true
                    description: Share of the video the average view in the range watched; null with no views
                  range:
                    type: string
                    enum:
                      - 7d
                      - 30d
                      - 90d
                    description: The range the timeline covers
                  from:
                    type: string
                    pattern: ^\d{4}-\d{2}-\d{2}$
                    description: First day of the range
                  to:
                    type: string
                    pattern: ^\d{4}-\d{2}-\d{2}$
                    description: Last day of the range, today
                  timeline:
                    type: array
                    items:
                      type: object
                      properties:
                        viewDate:
                          type: string
                          pattern: ^\d{4}-\d{2}-\d{2}$
                          description: UTC calendar day, YYYY-MM-DD
                        views:
                          type: integer
                          minimum: 0
                          description: Views counted that day
                        watchSeconds:
                          type: number
                          minimum: 0
                          description: Seconds watched by the views counted that day
                      required:
                        - viewDate
                        - views
                        - watchSeconds
                      additionalProperties: false
                    description: One entry per day of the range, oldest first
                  rangeViews:
                    type: integer
                    minimum: 0
                    description: Views counted inside the range
                required:
                  - videoId
                  - totalViews
                  - averageDailyViews
                  - averageRetention
                  - range
                  - from
                  - to
