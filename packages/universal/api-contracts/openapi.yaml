                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      handle:
                        type: string
                      displayName:
                        type: string
                      avatarUrl:
                        type: string
                        nullable: true
                    required:
                      - id
                      - handle
                      - displayName
                      - avatarUrl
                    additionalProperties: false
                    description: The channel that owns the resource, null for a user without one
                    nullable: true
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: The item id a reorder names
                        videoId:
                          type: string
                          format: uuid
                        position:
                          type: integer
                          minimum: 0
                          description: 0-based place in the playlist; a video hidden from this viewer keeps its place
                        addedAt:
                          type: string
                          description: ISO 8601 timestamp the video was added
                        video:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                              description: Video UUIDv7 identifier
                            ownerId:
                              type: string
                              format: uuid
