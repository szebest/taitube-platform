                              type: string
                              nullable: true
                              description: Video title
                            description:
                              type: string
                              nullable: true
                              description: Video description
                            visibility:
                              type: string
                              enum:
                                - private
                                - unlisted
                                - public
                              description: Access visibility level
                            status:
                              type: string
                              enum:
                                - UPLOADING
                                - UPLOADED
                                - PROBING
                                - PROCESSING
                                - READY
                                - FAILED
                                - REJECTED
                                - ABANDONED
                                - DELETED
                              description: Current pipeline lifecycle state
                            durationMs:
                              type: number
                              description: Video duration in milliseconds
                            posterUrl:
                              type: string
                              description: Public CDN URL to poster thumbnail (PRD US-12)
                            playbackUrl:
                              type: string
                              description: Public CDN playback URL to master.m3u8 if ready
                            viewsCount:
                              type: number
                              description: Total view count
                            likesCount:
                              type: integer
                              minimum: 0
                              description: Total like reactions count
                            dislikesCount:
                              type: integer
                              minimum: 0
                              description: Total dislike reactions count
                            categoryId:
                              type: string
                              format: uuid
                              nullable: true
                              description: Category UUID identifier
                            version:
                              type: integer
                              minimum: 0
                              description: Optimistic locking record version
                            createdAt:
                              type: string
                              description: ISO 8601 creation timestamp
                            updatedAt:
                              type: string
                              description: ISO 8601 last update timestamp
                            readyAt:
                              type: string
                              description: ISO 8601 ready timestamp if ready
                          required:
                            - id
                            - ownerId
                            - title
                            - description
                            - visibility
                            - status
                            - version
                            - createdAt
                            - updatedAt
                          additionalProperties: false
                        channel:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            handle:
                              type: string
                            displayName:
                              type: string
                            avatarUrl:
                              type: string
                              nullable: true
                          required:
                            - id
