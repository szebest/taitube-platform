  /v1/videos/{id}/comments:
    get:
      summary: List top-level comments of a video
      tags:
        - Comments
      description: Root comments with their author channel and reply count, the pinned comment first. Keyset-paginated under sort=top or sort=newest, with legacy page/size. The first top page is served from a 60 s Redis cache.
      parameters:
        - schema:
            type: string
            enum:
              - top
              - newest
            default: top
          in: query
          name: sort
          required: false
          description: 'top: pinned, likes, recency; newest'
        - schema:
            type: string
          in: query
          name: cursor
          required: false
          description: Opaque base64url keyset pagination cursor
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          in: query
          name: limit
          required: false
          description: 'Page size limit (1-100, default 20). A deployment with a lower PAGE_SIZE_MAX clamps rather than rejects: the page comes back shorter than asked for and nextCursor walks the remainder.'
