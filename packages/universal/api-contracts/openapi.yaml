  /v1/admin/videos/{id}:
    get:
      summary: Get video details as an operator
      tags:
        - Admin
      description: Retrieves full video details for an operator. Unlike the public route, a video the caller may not read is reported as 403 rather than disguised as 404.
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Video UUIDv7 identifier
                  ownerId:
                    type: string
                    format: uuid
                    description: Owning user UUID, for client-side ownership rules
                  title:
                    type: string
                    nullable: true
                    description: Video title
                  description:
                    type: string
                    nullable: true
                    description: Video description
                  visibility:
                    type: string
                    enum:
                      - private
                      - unlisted
                      - public
                    description: Access visibility level
                  status:
                    type: string
                    enum:
                      - UPLOADING
                      - UPLOADED
                      - PROBING
                      - PROCESSING
                      - READY
                      - FAILED
                      - REJECTED
                      - ABANDONED
                      - DELETED
                    description: Current pipeline lifecycle state
                  progress:
                    type: object
                    properties:
                      overall:
                        type: number
                        minimum: 0
                        maximum: 100
                        description: Overall encoding progress percentage 0-100
                      byRendition:
                        type: object
                        additionalProperties:
                          type: number
                          minimum: 0
                          maximum: 100
                        description: Encoding progress per rendition name
                    required:
                      - overall
                      - byRendition
                    additionalProperties: false
                    description: Encoding progress
                  durationMs:
                    type: number
                    description: Video duration in milliseconds
                  width:
                    type: number
                    description: Source video frame width in pixels
                  height:
                    type: number
                    description: Source video frame height in pixels
                  fps:
                    type: number
                    description: Source video frame rate
                  ladder:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: Rendition name
                        width:
                          type: number
                          description: Width in pixels
                        height:
                          type: number
                          description: Height in pixels
                        videoKbps:
                          type: number
                          description: Video bitrate in kbps
                        audioKbps:
                          type: number
                          description: Audio bitrate in kbps
                      required:
                        - name
                        - width
                        - height
                      additionalProperties: false
                      description: Transcoding ladder entry
                    description: Transcoding ladder configurations computed from probe
                  renditions:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: Rendition name (e.g. 1080p, 720p, 480p)
                        status:
                          type: string
                          description: Rendition encoding status (PENDING, RUNNING, DONE, FAILED)
                        playlistUrl:
                          type: string
                          description: URL to the rendition HLS playlist index.m3u8
                      required:
                        - name
                        - status
                      additionalProperties: false
                    description: List of renditions for this video
                  playbackUrl:
                    type: string
                    description: Public CDN playback URL to master.m3u8 (PRD OQ-2)
                  posterUrl:
                    type: string
                    description: Public CDN URL to poster image
                  spriteUrl:
                    type: string
                    description: Public CDN URL to thumbnail sprite sheet
                  spriteVttUrl:
                    type: string
                    description: Public CDN URL to WebVTT thumbnail cue sheet
                  likesCount:
                    type: integer
                    minimum: 0
                    default: 0
                    description: Total like reactions count
                  dislikesCount:
                    type: integer
                    minimum: 0
                    default: 0
                    description: Total dislike reactions count
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Machine-readable failure error code
                      message:
                        type: string
                        description: Human-readable error details
                    required:
                      - code
                      - message
                    additionalProperties: false
                    description: Failure error details
                  version:
                    type: integer
                    minimum: 0
                    description: Optimistic locking record version
                  createdAt:
                    type: string
                    description: ISO 8601 creation timestamp
                  updatedAt:
                    type: string
                    description: ISO 8601 last update timestamp
                  readyAt:
                    type: string
                    description: ISO 8601 ready transition timestamp
                required:
                  - id
                  - ownerId
                  - title
                  - description
                  - visibility
                  - status
                  - progress
                  - renditions
                  - version
                  - createdAt
                  - updatedAt
                additionalProperties: false
