              - recent
              - popular
              - trending
            default: recent
          in: query
          name: sort
          required: false
          description: 'Feed sort mode: recent (newest), popular (views count), trending (gravity ranking)'
        - schema:
            type: string
            format: uuid
          in: query
          name: categoryId
          required: false
          description: Optional category UUID filter
        - schema:
            type: string
          in: query
          name: cursor
          required: false
          description: Opaque base64url keyset pagination cursor
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          in: query
          name: limit
          required: false
