# The cloud credentials live in the secret store, never in this repo. External Secrets Operator
# materialises them into the `vp-secrets` Secret the base manifests read.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: vp-secrets
  namespace: video-pipeline
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vp-secret-store
  target:
    name: vp-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: video-pipeline/DATABASE_URL
    - secretKey: DATABASE_URL_MIGRATIONS
      remoteRef:
        key: video-pipeline/DATABASE_URL_MIGRATIONS
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: video-pipeline/REDIS_PASSWORD
    - secretKey: S3_ENDPOINT
      remoteRef:
        key: video-pipeline/S3_ENDPOINT
    - secretKey: S3_ACCESS_KEY_ID
      remoteRef:
        key: video-pipeline/S3_ACCESS_KEY_ID
    - secretKey: S3_SECRET_ACCESS_KEY
      remoteRef:
        key: video-pipeline/S3_SECRET_ACCESS_KEY
    - secretKey: OTEL_EXPORTER_OTLP_ENDPOINT
      remoteRef:
        key: video-pipeline/OTEL_EXPORTER_OTLP_ENDPOINT
    - secretKey: OTEL_EXPORTER_OTLP_HEADERS
      remoteRef:
        key: video-pipeline/OTEL_EXPORTER_OTLP_HEADERS
    - secretKey: CLOUDFLARE_TUNNEL_TOKEN
      remoteRef:
        key: video-pipeline/CLOUDFLARE_TUNNEL_TOKEN
