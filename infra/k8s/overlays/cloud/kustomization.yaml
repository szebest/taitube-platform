apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: video-pipeline

resources:
  - ../../base
  - cloudflared.yaml
  - redis.yaml
  - alloy.yaml

# Cloud overlay skeleton (Phase 4, Ticket 32)
# Replaces in-cluster Postgres and MinIO with Neon and Cloudflare R2 configurations
images:
  - name: ghcr.io/szebest/vp-api
    newName: ghcr.io/szebest/vp-api
    newTag: latest
  - name: ghcr.io/szebest/vp-worker
    newName: ghcr.io/szebest/vp-worker
    newTag: latest

# Cloud-specific ConfigMap overrides and ScaledObject sizing per SDD §12.3:
# maxReplicaCount is 1 for 1080p and 720p; 2 for 480p and probe.
patches:
  - target:
      kind: ConfigMap
      name: vp-config
    patch: |-
      - op: replace
        path: /data/DATABASE_POOL_MAX
        value: "5"
      - op: replace
        path: /data/CDN_BASE_URL
        value: "https://cdn.example.com"
      - op: replace
        path: /data/S3_REGION
        value: "auto"
      - op: replace
        path: /data/S3_FORCE_PATH_STYLE
        value: "false"
      - op: replace
        path: /data/REDIS_ADDR
        value: "vp-redis-master:6379"
      - op: add
        path: /data/OTEL_EXPORTER_OTLP_ENDPOINT
        value: "http://alloy:4318"
      - op: add
        path: /data/HOUSEKEEPING_INTERVAL_MS
        value: "900000"
  - target:
      group: keda.sh
      version: v1alpha1
      kind: ScaledObject
      name: vp-worker-transcode-1080p-scaledobject
    patch: |-
      - op: replace
        path: /spec/maxReplicaCount
        value: 1
  - target:
      group: keda.sh
      version: v1alpha1
      kind: ScaledObject
      name: vp-worker-transcode-720p-scaledobject
    patch: |-
      - op: replace
        path: /spec/maxReplicaCount
        value: 1
  - target:
      group: keda.sh
      version: v1alpha1
      kind: ScaledObject
      name: vp-worker-transcode-480p-scaledobject
    patch: |-
      - op: replace
        path: /spec/maxReplicaCount
        value: 2
  - target:
      group: keda.sh
      version: v1alpha1
      kind: ScaledObject
      name: vp-worker-probe-scaledobject
    patch: |-
      - op: replace
        path: /spec/maxReplicaCount
        value: 2
