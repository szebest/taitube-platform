apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vp-redis-master
  namespace: video-pipeline
  labels:
    app: vp-redis
spec:
  serviceName: "vp-redis-master"
  replicas: 1
  selector:
    matchLabels:
      app: vp-redis
  template:
    metadata:
      labels:
        app: vp-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        command: ["redis-server"]
        args:
        - "--requirepass"
        - "$(REDIS_PASSWORD)"
        - "--appendonly"
        - "yes"
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: vp-secrets
              key: REDIS_PASSWORD
        ports:
        - containerPort: 6379
          name: redis
        volumeMounts:
        - name: redis-data
          mountPath: /data
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
  volumeClaimTemplates:
  - metadata:
      name: redis-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vp-redis-master
  namespace: video-pipeline
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: vp-redis
