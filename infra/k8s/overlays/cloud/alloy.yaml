apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: video-pipeline
data:
  config.alloy: |
    // OTLP Receiver for traces, metrics, and logs from our apps
    otelcol.receiver.otlp "default" {
      grpc {
        endpoint = "0.0.0.0:4317"
      }
      http {
        endpoint = "0.0.0.0:4318"
      }
      output {
        metrics = [otelcol.processor.batch.default.input]
        logs    = [otelcol.processor.batch.default.input]
        traces  = [otelcol.processor.batch.default.input]
      }
    }

    otelcol.processor.batch "default" {
      output {
        metrics = [otelcol.exporter.otlp.grafanacloud.input]
        logs    = [otelcol.exporter.otlp.grafanacloud.input]
        traces  = [otelcol.exporter.otlp.grafanacloud.input]
      }
    }

    otelcol.exporter.otlp "grafanacloud" {
      client {
        endpoint = sys.env("GRAFANA_OTLP_ENDPOINT")
        headers = {
          "Authorization" = sys.env("GRAFANA_OTLP_HEADERS"),
        }
      }
    }

    // Optional: Prometheus remote write fallback if needed
    // prometheus.remote_write "default" { ... }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  namespace: video-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      labels:
        app: alloy
    spec:
      containers:
      - name: alloy
        image: grafana/alloy:latest
        args:
        - run
        - /etc/alloy/config.alloy
        - --server.http.listen-addr=0.0.0.0:12345
        env:
        - name: GRAFANA_OTLP_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: vp-secrets
              key: GRAFANA_OTLP_ENDPOINT
        - name: GRAFANA_OTLP_HEADERS
          valueFrom:
            secretKeyRef:
              name: vp-secrets
              key: GRAFANA_OTLP_HEADERS
        ports:
        - containerPort: 4317
          name: otlp-grpc
        - containerPort: 4318
          name: otlp-http
        volumeMounts:
        - name: config
          mountPath: /etc/alloy
      volumes:
      - name: config
        configMap:
          name: alloy-config
---
apiVersion: v1
kind: Service
metadata:
  name: alloy
  namespace: video-pipeline
spec:
  ports:
  - port: 4317
    targetPort: 4317
    name: otlp-grpc
  - port: 4318
    targetPort: 4318
    name: otlp-http
  selector:
    app: alloy
