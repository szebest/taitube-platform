apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: video-pipeline

resources:
  - ../../base

components:
  - ../../components/dev-mode

images:
  - name: ghcr.io/szebest/vp-api
    newName: vp-api
    newTag: local
  - name: ghcr.io/szebest/vp-worker
    newName: vp-worker
    newTag: local
  - name: ghcr.io/szebest/vp-web
    newName: vp-web
    newTag: local
  - name: ghcr.io/szebest/vp-studio
    newName: vp-studio
    newTag: local
