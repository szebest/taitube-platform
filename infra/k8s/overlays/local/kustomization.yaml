apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: video-pipeline

resources:
  - ../../base


images:
  - name: ghcr.io/szebest/vp-api
    newName: vp-api
    newTag: local
  - name: ghcr.io/szebest/vp-worker
    newName: vp-worker
    newTag: local

patches:
  # `make k3d-deploy` writes this once with random values: the base Secret's placeholders are
  # refused by a production boot, and this cluster runs NODE_ENV=production.
  - path: secrets.patch.yaml
  - target:
      kind: Deployment
      name: vp-api
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: .*
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
