# infra/k8s/helm-values/minio.yaml
# `-dev` carries the shell and `docker-entrypoint.sh` the chart runs.
image:
  repository: cgr.dev/chainguard/minio
  tag: latest-dev@sha256:5ed9207c9d1bf50e2b0aa917ffb0fede5507651178b7bd4119ff75319e7fdeec
mcImage:
  repository: cgr.dev/chainguard/minio-client
  tag: latest-dev@sha256:603a402c2cd1543109c39eb5d1f731bd83b3c8f6ee8299b3785c8519fad0f5b5

rootUser: minioadmin
rootPassword: minioadmin

mode: standalone
replicas: 1

persistence:
  enabled: true
  size: 10Gi

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# charts.min.io creates these in its post-install job; `defaultBuckets` is the Bitnami chart's key.
buckets:
  - name: raw
    policy: none
    purge: false
  - name: public
    policy: download
    purge: false

postJob:
  podAnnotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
