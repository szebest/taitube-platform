# infra/k8s/helm-values/minio.yaml
rootUser: minioadmin
rootPassword: minioadmin

mode: standalone
replicas: 1

persistence:
  enabled: true
  size: 10Gi

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# charts.min.io creates these in its post-install job; `defaultBuckets` is the Bitnami chart's key.
buckets:
  - name: raw
    policy: none
    purge: false
  - name: public
    policy: download
    purge: false

postJob:
  podAnnotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
