apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - target:
      kind: ConfigMap
      name: vp-config
    patch: |-
      - op: replace
        path: /data/NODE_ENV
        value: "development"
      - op: replace
        path: /data/AUTH_MODE
        value: "dev"
  - target:
      kind: Secret
      name: vp-secrets
    patch: |-
      - op: add
        path: /stringData/ADMIN_TOKEN
        value: "change-me-admin-token-local-cluster"
      - op: add
        path: /stringData/VIDEO_ACCESS_SECRET
        value: "change-me-video-access"
      - op: add
        path: /stringData/LIVE_HOOK_SECRET
        value: "change-me-live-hook"
      - op: add
        path: /stringData/WATCH_PARTY_GUEST_SALT
        value: "change-me-party-salt"
      - op: add
        path: /stringData/LIVEKIT_API_KEY
        value: "change-me-livekit-key"
      - op: add
        path: /stringData/LIVEKIT_API_SECRET
        value: "change-me-livekit-secret-0123456789abcdef"
  - target:
      kind: Deployment
      name: .*
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
