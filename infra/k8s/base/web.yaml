apiVersion: apps/v1
kind: Deployment
metadata:
  name: vp-web
  namespace: video-pipeline
  labels:
    app.kubernetes.io/name: vp-web
    app.kubernetes.io/part-of: video-pipeline
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: vp-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vp-web
        app.kubernetes.io/part-of: video-pipeline
    spec:
      # preStop (5 s) + srvx closing its connections + 5 s before SIGKILL.
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: web
          image: ghcr.io/szebest/vp-web:latest
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: SSR_API_BASE_URL
              value: http://vp-api:3000
          ports:
            - name: http
              containerPort: 5173
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /robots.txt
              port: 5173
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /robots.txt
              port: 5173
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: vp-web
  namespace: video-pipeline
  labels:
    app.kubernetes.io/name: vp-web
    app.kubernetes.io/part-of: video-pipeline
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vp-web
  ports:
    - name: http
      port: 5173
      targetPort: 5173
