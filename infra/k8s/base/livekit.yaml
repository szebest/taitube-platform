apiVersion: apps/v1
kind: Deployment
metadata:
  name: vp-livekit
  namespace: video-pipeline
  labels:
    app.kubernetes.io/name: vp-livekit
    app.kubernetes.io/component: voice
    app.kubernetes.io/part-of: video-pipeline
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: vp-livekit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vp-livekit
        app.kubernetes.io/component: voice
        app.kubernetes.io/part-of: video-pipeline
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: livekit
          image: livekit/livekit-server:v1.13.11@sha256:25cd902de7cacbd5f1f779f6a6ac1eae20ba8f56b0935934ce6b0ab80d1e3d20
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 7880
            - name: ice-tcp
              containerPort: 7881
            - name: ice-udp
              containerPort: 7882
              protocol: UDP
            - name: turn-udp
              containerPort: 3478
              protocol: UDP
            - name: metrics
              containerPort: 6789
          env:
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vp-secrets
                  key: LIVEKIT_API_KEY
                  optional: true
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: vp-secrets
                  key: LIVEKIT_API_SECRET
                  optional: true
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vp-secrets
                  key: REDIS_PASSWORD
            - name: LIVEKIT_KEYS
              value: "$(LIVEKIT_API_KEY): $(LIVEKIT_API_SECRET)"
            - name: NODE_IP
              value: "127.0.0.1"
            - name: LIVEKIT_CONFIG
              value: |
                port: 7880
                log_level: info
                prometheus_port: 6789
                rtc:
                  tcp_port: 7881
                  udp_port: 7882
                  use_external_ip: false
                  stun_servers: []
                turn:
                  enabled: true
                  domain: localhost
                  udp_port: 3478
                redis:
                  address: vp-redis-master:6379
                webhook:
                  api_key: $(LIVEKIT_API_KEY)
                  urls:
                    - http://vp-api:3000/v1/internal/voice/webhook
                room:
                  auto_create: true
                  empty_timeout: 60
                  departure_timeout: 20
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: vp-livekit
  namespace: video-pipeline
  labels:
    app.kubernetes.io/name: vp-livekit
    app.kubernetes.io/part-of: video-pipeline
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: vp-livekit
  ports:
    - name: http
      port: 7880
      targetPort: 7880
    - name: ice-tcp
      port: 7881
      targetPort: 7881
    - name: ice-udp
      port: 7882
      targetPort: 7882
      protocol: UDP
