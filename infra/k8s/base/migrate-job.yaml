apiVersion: batch/v1
kind: Job
metadata:
  name: vp-migrate
  namespace: video-pipeline
spec:
  backoffLimit: 5
  template:
    metadata:
      name: vp-migrate
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: migrate
          image: ghcr.io/szebest/vp-api:latest
          command: ["node", "dist/migrate.js"]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: vp-config
            - secretRef:
                name: vp-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
