apiVersion: apps/v1
kind: Deployment
metadata:
  name: vp-worker-housekeeping
  namespace: video-pipeline
  labels:
    app.kubernetes.io/name: vp-worker-housekeeping
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: video-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vp-worker-housekeeping
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vp-worker-housekeeping
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: video-pipeline
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: worker
          image: ghcr.io/szebest/vp-worker:latest
          command: ["sh", "-c", "exec ${WORKER_RUNTIME:-bun} --import ./dist/instrument.js dist/main.js"]
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: metrics
              containerPort: 9464
          envFrom:
            - configMapRef:
                name: vp-config
            - secretRef:
                name: vp-secrets
          env:
            - name: WORKER_STAGE
              value: housekeeping
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp/vp
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - test -f /tmp/vp/heartbeat && test $(( $(date +%s) - $(cat /tmp/vp/heartbeat) )) -lt 45
            periodSeconds: 30
            initialDelaySeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vp-worker-housekeeping
  namespace: video-pipeline
  labels:
    app.kubernetes.io/name: vp-worker-housekeeping
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: video-pipeline
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vp-worker-housekeeping
  ports:
    - name: metrics
      port: 9464
      targetPort: 9464
