apiVersion: apps/v1
kind: Deployment
metadata:
  name: vp-worker-transcode-1080p
  namespace: video-pipeline
  labels:
    app.kubernetes.io/name: vp-worker-transcode-1080p
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: video-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vp-worker-transcode-1080p
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vp-worker-transcode-1080p
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: video-pipeline
    spec:
      terminationGracePeriodSeconds: 900
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: worker
          image: ghcr.io/szebest/vp-worker:latest
          command: ["sh", "-c", "exec ${WORKER_RUNTIME:-bun} dist/main.js"]
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: metrics
              containerPort: 9464
          envFrom:
            - configMapRef:
                name: vp-config
            - secretRef:
                name: vp-secrets
          env:
            - name: WORKER_STAGE
              value: transcode-1080p
            - name: OTEL_SERVICE_NAME
              value: vp-worker-transcode-1080p
            - name: FFMPEG_THREADS
              valueFrom:
                resourceFieldRef:
                  resource: limits.cpu
          resources:
            requests:
              cpu: "1500m"
              memory: "1.5Gi"
              ephemeral-storage: "6Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
              ephemeral-storage: "8Gi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp/vp
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - test -f /tmp/vp/heartbeat || exit 0; test $(( $(date +%s) - $(cat /tmp/vp/heartbeat 2>/dev/null || stat -c %Y /tmp/vp/heartbeat 2>/dev/null || date +%s) )) -lt 120
            periodSeconds: 30
            initialDelaySeconds: 15
            timeoutSeconds: 5
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vp-worker-transcode-1080p
  namespace: video-pipeline
  labels:
    app.kubernetes.io/name: vp-worker-transcode-1080p
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: video-pipeline
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vp-worker-transcode-1080p
  ports:
    - name: metrics
      port: 9464
      targetPort: 9464
