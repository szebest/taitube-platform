apiVersion: apps/v1
kind: Deployment
metadata:
  name: vp-api
  namespace: video-pipeline
  labels:
    app.kubernetes.io/name: vp-api
    app.kubernetes.io/part-of: video-pipeline
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: vp-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vp-api
        app.kubernetes.io/part-of: video-pipeline
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: ghcr.io/szebest/vp-api:latest
          command: ["node", "dist/main.js"]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 3000
            - name: metrics
              containerPort: 9464
          envFrom:
            - configMapRef:
                name: vp-config
            - secretRef:
                name: vp-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: vp-api
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /livez
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: vp-api
  namespace: video-pipeline
  labels:
    app.kubernetes.io/name: vp-api
    app.kubernetes.io/part-of: video-pipeline
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vp-api
  ports:
    - name: http
      port: 3000
      targetPort: 3000
    - name: metrics
      port: 9464
      targetPort: 9464
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vp-api-hpa
  namespace: video-pipeline
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vp-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
