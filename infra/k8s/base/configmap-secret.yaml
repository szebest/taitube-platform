apiVersion: v1
kind: ConfigMap
metadata:
  name: vp-config
  namespace: video-pipeline
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  PORT: "3000"
  METRICS_PORT: "9464"
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"
  CORS_ORIGINS: "http://localhost:5173,http://localhost:4173,http://localhost:8080"
  DATABASE_POOL_MAX: "10"
  REDIS_URL: "redis://vp-redis-master:6379/0"
  REDIS_PUBSUB_URL: "redis://vp-redis-master:6379/1"
  BULLMQ_PREFIX: "bull"
  S3_REGION: "us-east-1"
  S3_FORCE_PATH_STYLE: "true"
  S3_BUCKET_RAW: "raw"
  S3_BUCKET_PUBLIC: "public"
  S3_PRESIGN_TTL_SEC: "900"
  CDN_BASE_URL: "http://localhost:9000/public"
  S3_MULTIPART_THRESHOLD_BYTES: "104857600"
  S3_PART_SIZE_MIN_BYTES: "8388608"
  S3_PART_SIZE_MAX_BYTES: "67108864"
  RAW_RETENTION_DAYS: "7"
  AUTH_MODE: "jwks"
  AUTH_ISSUER: "vp-dev"
  AUTH_AUDIENCE: "vp-api"
  AUTH_DEV_USER_ID: "00000000-0000-7000-8000-000000000001"
  WORKER_RUNTIME: "bun"
  FFMPEG_PATH: "ffmpeg"
  FFPROBE_PATH: "ffprobe"
  X264_PRESET: "veryfast"
  HLS_SEGMENT_SECONDS: "6"
  GOP_SECONDS: "2"
  MAX_UPLOAD_BYTES: "4294967296"
  MAX_DURATION_SEC: "3600"
  MAX_INFLIGHT_PER_USER: "3"
  TMP_DIR: "/tmp/vp"
  SSE_HEARTBEAT_MS: "15000"
  SSE_MAX_PER_USER: "20"
  SSE_MAX_PER_POD: "5000"
  SPRITE_INTERVAL_SECONDS: "5"
---
apiVersion: v1
kind: Secret
metadata:
  name: vp-secrets
  namespace: video-pipeline
type: Opaque
stringData:
  DATABASE_URL: "postgres://vp:vp@vp-postgres:5432/vp"
  REDIS_PASSWORD: "vp"
  S3_ENDPOINT: "http://vp-minio:9000"
  S3_ACCESS_KEY_ID: "minioadmin"
  S3_SECRET_ACCESS_KEY: "minioadmin"
