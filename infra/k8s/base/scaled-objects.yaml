apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: vp-worker-probe-scaledobject
  namespace: video-pipeline
  labels:
    app.kubernetes.io/name: vp-worker-probe
    app.kubernetes.io/component: autoscaler
    app.kubernetes.io/part-of: video-pipeline
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vp-worker-probe
  minReplicaCount: 0
  maxReplicaCount: 4
  pollingInterval: 10
  cooldownPeriod: 300
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Pods
              value: 4
              periodSeconds: 30
            - type: Percent
              value: 100
              periodSeconds: 30
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Pods
              value: 1
              periodSeconds: 60
            - type: Percent
              value: 10
              periodSeconds: 60
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
        query: |
          sum(max by (state) (bullmq_queue_jobs{queue="probe", state=~"waiting|prioritized|active"})) or vector(0)
        threshold: "1"
        activationThreshold: "0"
---
