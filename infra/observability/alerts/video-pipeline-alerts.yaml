groups:
  - name: video_pipeline_alerts
    rules:
      # 1. DLQNotEmpty
      - alert: DLQNotEmpty
        expr: increase(dlq_entries_total[10m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Job routed to Dead-Letter Queue (DLQ) in queue {{ $labels.queue }}"
          description: "New DLQ entry detected for queue {{ $labels.queue }} with error_code {{ $labels.error_code }} in the last 10 minutes."
          runbook_url: "docs/runbooks/dlq-replay.md"

      # 2. QueueStarvation
      - alert: QueueStarvation
        expr: bullmq_queue_oldest_waiting_age_seconds{queue!="captions"} > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Queue {{ $labels.queue }} is starving: oldest waiting job is older than 15 minutes"
          description: "Jobs in queue {{ $labels.queue }} have been waiting for {{ $value | humanizeDuration }}, exceeding 15m threshold."
          runbook_url: "docs/runbooks/queue-starvation.md"

      # 3. JobFailureRateHigh
      - alert: JobFailureRateHigh
        expr: |
          sum(rate(jobs_processed_total{result="failed"}[10m])) by (queue)
          /
          sum(rate(jobs_processed_total[10m])) by (queue) > 0.05
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "High job failure rate in queue {{ $labels.queue }} (> 5%)"
          description: "Queue {{ $labels.queue }} has a failure rate of {{ $value | humanizePercentage }} over the last 10 minutes."
          runbook_url: "docs/runbooks/job-failure.md"

      # 4. SystemicFailure
      - alert: SystemicFailure
        expr: |
          sum(rate(jobs_processed_total{result="failed"}[5m])) by (queue)
          /
          sum(rate(jobs_processed_total[5m])) by (queue) > 0.5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Systemic failure in queue {{ $labels.queue }} (> 50% failures) — pause queue"
          description: "Queue {{ $labels.queue }} has a failure rate of {{ $value | humanizePercentage }} over 5m. Execute systemic failure runbook to pause queue."
          runbook_url: "docs/runbooks/queue-paused.md"

      # 5. WorkerStalledJobs
      - alert: WorkerStalledJobs
        expr: sum(increase(jobs_processed_total{result="stalled"}[30m])) by (queue) > 3
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Multiple stalled jobs detected in queue {{ $labels.queue }}"
          description: "Queue {{ $labels.queue }} observed {{ $value }} stalled jobs in the last 30 minutes. Worker containers may be crashing or killed by OOM."
          runbook_url: "docs/runbooks/worker-stalled.md"

      # 6. WorkerStuck
      - alert: WorkerStuck
        expr: processing_steps_running_stale > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Worker step stuck: RUNNING with heartbeat older than 5 minutes"
          description: "{{ $value }} processing steps in RUNNING status have not updated heartbeats for > 5m."
          runbook_url: "docs/runbooks/worker-stuck.md"

      # 7. ScaleToZeroBroken (Kubernetes-only)
      - alert: ScaleToZeroBroken
        expr: |
          (sum(max by (queue, state) (bullmq_queue_jobs{state=~"waiting|prioritized"})) > 0)
          and on()
          (sum(kube_deployment_status_replicas{deployment=~"vp-worker-.*"}) == 0)
        for: 3m
        labels:
          severity: critical
          environment: kubernetes-only
        annotations:
          summary: "Autoscaling broken: jobs waiting but worker replicas remain 0"
          description: "Queue has waiting jobs for > 3m while worker deployment replicas remain 0. Check KEDA operator and ScaledObject status."
          runbook_url: "docs/runbooks/scale-to-zero.md"

      # 8. R2ClassABudget
      - alert: R2ClassABudget
        expr: predict_linear(storage_ops_total{op="put"}[1d], 30 * 86400) > 900000
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "Projected monthly R2 Class A ops exceeds 90% of free budget (> 900k ops/month)"
          description: "Linear projection from last 24h indicates {{ $value | humanize }} Class A ops/month against the 1,000,000 free tier limit."
          runbook_url: "docs/runbooks/cost-budget.md"

      # 9. APILatencyHigh
      - alert: APILatencyHigh
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "API p95 latency exceeds 200 ms SLO ({{ $value | humanizeDuration }})"
          description: "Overall 95th percentile HTTP request duration has exceeded 200 ms for 10 minutes."
          runbook_url: "docs/runbooks/api-latency.md"

      # 10. WorkerTmpDiskHigh
      - alert: WorkerTmpDiskHigh
        expr: (worker_tmp_bytes / 8e9) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Worker temporary disk usage exceeds 80% of 8 GB emptyDir limit on {{ $labels.stage }}"
          description: "Stage {{ $labels.stage }} temporary storage (/tmp/vp) usage is {{ $value | humanizePercentage }} of 8 GB limit."
          runbook_url: "docs/runbooks/worker-disk.md"

      # 11. CaptionsQueueStale
      - alert: CaptionsQueueStale
        expr: bullmq_queue_oldest_waiting_age_seconds{queue="captions"} > 21600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Captions queue is stale: oldest waiting job is older than 6 hours"
          description: "Jobs in the captions queue have been waiting for {{ $value | humanizeDuration }}. Captions run at the lowest priority on their own pods, so a short wait is normal; check the captions workers and their ScaledObject."
          runbook_url: "docs/runbooks/queue-starvation.md"

      # 12. ScreeningHoldRateHigh
      - alert: ScreeningHoldRateHigh
        expr: |
          (
            sum(increase(screening_outcomes_total{outcome="HOLD"}[24h]))
            / sum(increase(screening_outcomes_total[24h]))
          ) > 0.2
          and on()
          sum(increase(screening_outcomes_total[24h])) >= 20
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Upload screening holds more than 20% of videos over 24 h ({{ $value | humanizePercentage }})"
          description: "A miscalibrated threshold floods the moderation queue. Compare screening_outcomes_total by reason, then the thresholds in packages/server/env-schema/src/tuning.ts."
          runbook_url: "docs/runbooks/screening-hold-rate.md"

      # 13. WatchPartyDriftHigh
      - alert: WatchPartyDriftHigh
        expr: histogram_quantile(0.95, sum(rate(watch_party_drift_seconds_bucket[5m])) by (le)) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Watch party drift p95 exceeds 1 s ({{ $value | humanizeDuration }})"
          description: "Members report being more than a second off the room clock at the 95th percentile. Check the clock skew between pods and Postgres, fan-out latency and API CPU."
          runbook_url: "docs/runbooks/watch-party-drift.md"

      # 14. WatchPartyFanoutSlow
      - alert: WatchPartyFanoutSlow
        expr: histogram_quantile(0.95, sum(rate(watch_party_fanout_seconds_bucket[5m])) by (le)) > 0.25
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Watch party fan-out p95 exceeds 250 ms ({{ $value | humanizeDuration }})"
          description: "Room frames take over 250 ms from publish to the socket write on a pod. Check Redis pub/sub latency and the pods' event loop."
          runbook_url: "docs/runbooks/watch-party-fanout.md"

      # 15. WatchPartyPasswordBruteForce
      - alert: WatchPartyPasswordBruteForce
        expr: sum(rate(watch_party_joins_total{outcome=~"password_invalid|locked"}[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Watch party password failures exceed 1 per second ({{ $value | humanize }}/s)"
          description: "Wrong or locked password joins are sustained. Someone may be guessing room passwords."
          runbook_url: "docs/runbooks/watch-party-password-abuse.md"

      # 16. WatchPartyGuestFlood
      - alert: WatchPartyGuestFlood
        expr: sum(rate(watch_party_joins_total{kind="guest"}[5m])) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Watch party guest joins exceed 10 per second ({{ $value | humanize }}/s)"
          description: "Guest join attempts are sustained well above normal. Check where they come from and whether the per-IP and per-room limits hold."
          runbook_url: "docs/runbooks/watch-party-guest-flood.md"

      # 17. WatchPartyClockSkew
      - alert: WatchPartyClockSkew
        expr: max(abs(watch_party_clock_skew_seconds)) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "A pod clock is more than 100 ms off Postgres ({{ $value | humanizeDuration }})"
          description: "The room clock is the pod's wall clock, so skewed pods give members different positions."
          runbook_url: "docs/runbooks/watch-party-clock-skew.md"
