name: production
kind: k3s
description: "What real users reach: the cloud overlay, a release tag pinned at deploy time, the context checked and the name typed back before anything applies."
production: true
protected: true
typedConfirmation: true
images:
  source: registry
  registry: ghcr.io/szebest
  tag: latest
hosts:
  web: taitube.example.com
  studio: studio.taitube.example.com
  api: api.taitube.example.com
  cdn: cdn.taitube.example.com
features:
  captions: true
  screening: true
config:
  AUTH_JWKS_URL: https://auth.taitube.example.com/.well-known/jwks.json
  AUTH_ISSUER: https://auth.taitube.example.com/
  AUTH_AUDIENCE: taitube
  S3_BUCKET_RAW: vp-raw
  S3_BUCKET_PUBLIC: vp-public
secrets:
  source: external-secrets
  keys:
    - DATABASE_URL
    - DATABASE_URL_MIGRATIONS
    - REDIS_PASSWORD
    - S3_ENDPOINT
    - S3_ACCESS_KEY_ID
    - S3_SECRET_ACCESS_KEY
    - GRAFANA_OTLP_ENDPOINT
    - GRAFANA_OTLP_HEADERS
    - CLOUDFLARE_TUNNEL_TOKEN
health:
  readyzTimeoutSec: 300
  smoke: false
cluster:
  context: k3s-production
  namespace: video-pipeline
  backing: managed
scaling:
  maxReplicas:
    probe: 2
    transcode-1080p: 1
    transcode-720p: 1
    transcode-480p: 2
    captions: 1
    live: 1
  budget:
    cpu: "8"
    memory: 16Gi
    pods: 40
