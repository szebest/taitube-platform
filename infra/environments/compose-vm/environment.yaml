name: compose-vm
kind: compose
description: "One virtual machine running Docker Compose: Redis in the compose project, Postgres and object storage managed, the API and every worker stage on fixed replicas."
production: true
protected: true
images:
  source: registry
  registry: ghcr.io/szebest
  tag: latest
hosts:
  api: api.taitube.example.com
  cdn: cdn.taitube.example.com
features:
  captions: true
  screening: true
config:
  AUTH_JWKS_URL: https://auth.taitube.example.com/.well-known/jwks.json
  AUTH_ISSUER: https://auth.taitube.example.com/
  AUTH_AUDIENCE: taitube
  S3_BUCKET_RAW: vp-raw
  S3_BUCKET_PUBLIC: vp-public
secrets:
  source: env-file
  keys:
    - DATABASE_URL
    - DATABASE_URL_MIGRATIONS
    - REDIS_PASSWORD
    - S3_ENDPOINT
    - S3_ACCESS_KEY_ID
    - S3_SECRET_ACCESS_KEY
    - CLOUDFLARE_TUNNEL_TOKEN
health:
  readyzTimeoutSec: 180
  smoke: false
compose:
  file: infra/environments/compose-vm/docker-compose.yml
  project: vp-vm
  context: vp-vm
