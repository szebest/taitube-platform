global:
  resolve_timeout: 5m

route:
  # Root route groups by alertname and stage/service
  group_by: ['alertname', 'stage', 'service']
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h
  receiver: 'default-webhook'
  routes:
    # Critical alerts: page immediately, shorter repeat interval
    - match:
        severity: critical
      receiver: 'critical-webhook'
      group_wait: 5s
      group_interval: 15s
      repeat_interval: 30m

    # Warning alerts: group normally
    - match:
        severity: warning
      receiver: 'warning-webhook'
      group_wait: 15s
      group_interval: 1m
      repeat_interval: 2h

    # Info alerts: budget & informational notifications
    - match:
        severity: info
      receiver: 'info-webhook'
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 6h

receivers:
  # Default receiver (catches anything unmatched)
  - name: 'default-webhook'
    webhook_configs:
      - url: 'http://localhost:5001/webhook'
        send_resolved: true

  # Critical receiver (Discord / Telegram / PagerDuty webhook endpoint)
  - name: 'critical-webhook'
    webhook_configs:
      - url: 'http://localhost:5001/webhook/critical'
        send_resolved: true

  # Warning receiver (Discord / Telegram webhook channel)
  - name: 'warning-webhook'
    webhook_configs:
      - url: 'http://localhost:5001/webhook/warning'
        send_resolved: true

  # Info receiver (low-priority notifications)
  - name: 'info-webhook'
    webhook_configs:
      - url: 'http://localhost:5001/webhook/info'
        send_resolved: true
