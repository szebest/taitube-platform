name: video-pipeline

x-app-env: &app-env
  DATABASE_URL: postgres://vp:vp@postgres:5432/vp
  DATABASE_URL_MIGRATIONS: postgres://vp:vp@postgres:5432/vp
  REDIS_URL: redis://:vp@redis:6379/0
  REDIS_PUBSUB_URL: redis://:vp@redis:6379/1
  REDIS_ADDR: redis:6379
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: vp
  STORAGE_ENDPOINT: http://minio:9000
  S3_ENDPOINT: http://minio:9000
  S3_FORCE_PATH_STYLE: "true"
  STORAGE_FORCE_PATH_STYLE: "true"

services:
  postgres:
    image: postgres:16-alpine
    container_name: vp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vp}
      POSTGRES_DB: ${POSTGRES_DB:-vp}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vp}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: vp-redis
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "noeviction",
        "--requirepass",
        "${REDIS_PASSWORD:-vp}"
      ]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-vp}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:latest
    container_name: vp-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio-init:
    image: minio/mc:latest
    container_name: vp-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init/minio-init.sh"]
    volumes:
      - ./minio-init.sh:/init/minio-init.sh:ro

  migrate:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: vp-migrate
    env_file:
      - ../../.env
    environment:
      <<: *app-env
    command: ["node", "dist/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: vp-api
    env_file:
      - ../../.env
    environment:
      <<: *app-env
    ports:
      - "3000:3000"
      - "9464:9464"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    command: ["node", "dist/main.js"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---- workers: one image, WORKER_STAGE picks the role (SDD §12.1) ----
  worker-probe: &worker
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
      args:
        WORKER_RUNTIME: ${WORKER_RUNTIME:-bun}
    env_file:
      - ../../.env
    environment:
      <<: *app-env
      WORKER_STAGE: probe
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    tmpfs:
      - /tmp/vp:size=2g,mode=1777
    restart: on-failure

  worker-transcode-1080p:
    <<: *worker
    environment:
      <<: *app-env
      WORKER_STAGE: transcode-1080p
      FFMPEG_THREADS: "2"
    tmpfs:
      - /tmp/vp:size=4g,mode=1777

  worker-transcode-720p:
    <<: *worker
    environment:
      <<: *app-env
      WORKER_STAGE: transcode-720p
      FFMPEG_THREADS: "2"
    tmpfs:
      - /tmp/vp:size=4g,mode=1777

  worker-transcode-480p:
    <<: *worker
    environment:
      <<: *app-env
      WORKER_STAGE: transcode-480p
      FFMPEG_THREADS: "1"
    tmpfs:
      - /tmp/vp:size=2g,mode=1777

  worker-thumbnail:
    <<: *worker
    environment:
      <<: *app-env
      WORKER_STAGE: thumbnail
    tmpfs:
      - /tmp/vp:size=1g,mode=1777

  worker-package:
    <<: *worker
    environment:
      <<: *app-env
      WORKER_STAGE: package
    tmpfs:
      - /tmp/vp:size=1g,mode=1777

  worker-notify:
    <<: *worker
    environment:
      <<: *app-env
      WORKER_STAGE: notify

  worker-housekeeping:
    <<: *worker
    environment:
      <<: *app-env
      WORKER_STAGE: housekeeping

  hls-test-page:
    image: nginx:alpine
    profiles:
      - tools
    ports:
      - "8080:80"
    volumes:
      - ../../tools/hls-test-page:/usr/share/nginx/html:ro

  # ---- observability (profile: observability) ---------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: vp-prometheus
    profiles:
      - observability
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../observability/alerts:/etc/prometheus/rules:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    restart: on-failure

  alertmanager:
    image: prom/alertmanager:latest
    container_name: vp-alertmanager
    profiles:
      - observability
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    restart: on-failure

  grafana:
    image: grafana/grafana:latest
    container_name: vp-grafana
    profiles:
      - observability
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../observability/dashboards:/var/lib/grafana/dashboards:ro
    restart: on-failure

  tempo:
    image: grafana/tempo:latest
    container_name: vp-tempo
    profiles:
      - observability
    ports:
      - "3200:3200"
      - "4317:4317"
    command:
      - "-config.file=/etc/tempo.yml"
    volumes:
      - ./tempo/tempo.yml:/etc/tempo.yml:ro
    restart: on-failure

  loki:
    image: grafana/loki:latest
    container_name: vp-loki
    profiles:
      - observability
    ports:
      - "3100:3100"
    command:
      - "-config.file=/etc/loki/local-config.yaml"
    volumes:
      - ./loki/loki.yml:/etc/loki/local-config.yaml:ro
    restart: on-failure

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: vp-otel-collector
    profiles:
      - observability
    ports:
      - "4318:4318"
    volumes:
      - ./otel-collector/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - tempo
      - loki
    restart: on-failure

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    container_name: vp-toxiproxy
    profiles:
      - chaos
    ports:
      - "8474:8474"
      - "9002:9002"
    volumes:
      - ./toxiproxy/toxiproxy.json:/etc/toxiproxy.json:ro
    command: ["-host=0.0.0.0", "-config=/etc/toxiproxy.json"]
    restart: on-failure

volumes:
  pgdata:
  redisdata:
  miniodata:

