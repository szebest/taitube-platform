name: video-pipeline

x-app-build: &app-build
  context: ../..
  dockerfile: Dockerfile

x-app-env: &app-env
  DATABASE_URL: postgres://vp:vp@postgres:5432/vp
  REDIS_URL: redis://redis:6379/0
  REDIS_PUBSUB_URL: redis://redis:6379/1
  REDIS_PASSWORD: vp
  S3_ENDPOINT: http://minio:9000
  S3_FORCE_PATH_STYLE: "true"

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vp}
      POSTGRES_DB: ${POSTGRES_DB:-vp}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vp}"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 1s

  redis:
    image: ${REDIS_IMAGE:-redis:8-alpine}
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "noeviction",
        "--requirepass",
        "${REDIS_PASSWORD:-vp}"
      ]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-vp}", "ping"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 1s

  minio:
    image: cgr.dev/chainguard/minio@sha256:59667194421209c2c1eacbe761e24787e047985c5dfa96b15da9b59fe9b55cd0
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: cgr.dev/chainguard/minio-client@sha256:603a402c2cd1543109c39eb5d1f731bd83b3c8f6ee8299b3785c8519fad0f5b5
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "/init/minio-init.sh"]
    volumes:
      - ./minio-init.sh:/init/minio-init.sh:ro

  migrate:
    image: vp-api:local
    build:
      <<: *app-build
      target: api
    profiles:
      - migrate
    env_file:
      - ../../.env
    environment:
      <<: *app-env
    command: ["sh", "-c", "node dist/migrate.js && node dist/seed.js"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: vp-api:local
    build:
      <<: *app-build
      target: api
    profiles:
      - api
    env_file:
      - ../../.env
    environment:
      <<: *app-env
    ports:
      - "3000:3000"
      - "9464:9464"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    stop_signal: SIGTERM
    stop_grace_period: 25s
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/readyz || exit 1"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 1s

  web:
    image: vp-web:local
    build:
      <<: *app-build
      target: web
    profiles:
      - web
    environment:
      SSR_API_BASE_URL: http://api:3000
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    stop_signal: SIGTERM
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:5173/robots.txt || exit 1"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 1s

  # ---- workers: one image, WORKER_STAGE picks the role (SDD §12.1) ----
  worker-probe: &worker
    image: vp-worker:local
    build:
      <<: *app-build
      target: worker
      args:
        WORKER_RUNTIME: ${WORKER_RUNTIME:-bun}
    profiles:
      - worker
    env_file:
      - ../../.env
    environment:
      <<: *app-env
      WORKER_STAGE: probe
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    tmpfs:
      - /tmp/vp:size=2g,mode=1777
    restart: on-failure
    stop_signal: SIGTERM
    stop_grace_period: 55s
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:$${METRICS_PORT:-9464}/readyz || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 6
      start_period: 5s

  worker-transcode-1080p:
    <<: *worker
    stop_grace_period: 895s
    environment:
      <<: *app-env
      WORKER_STAGE: transcode-1080p
      FFMPEG_THREADS: "2"
    tmpfs:
      - /tmp/vp:size=4g,mode=1777

  worker-transcode-720p:
    <<: *worker
    stop_grace_period: 595s
    environment:
      <<: *app-env
      WORKER_STAGE: transcode-720p
      FFMPEG_THREADS: "2"
    tmpfs:
      - /tmp/vp:size=4g,mode=1777

  worker-transcode-480p:
    <<: *worker
    stop_grace_period: 295s
    environment:
      <<: *app-env
      WORKER_STAGE: transcode-480p
      FFMPEG_THREADS: "1"
    tmpfs:
      - /tmp/vp:size=2g,mode=1777

  worker-thumbnail:
    <<: *worker
    stop_grace_period: 115s
    environment:
      <<: *app-env
      WORKER_STAGE: thumbnail
    tmpfs:
      - /tmp/vp:size=1g,mode=1777

  worker-package:
    <<: *worker
    stop_grace_period: 115s
    environment:
      <<: *app-env
      WORKER_STAGE: package
    tmpfs:
      - /tmp/vp:size=1g,mode=1777

  worker-notify:
    <<: *worker
    stop_grace_period: 25s
    environment:
      <<: *app-env
      WORKER_STAGE: notify

  worker-housekeeping:
    <<: *worker
    stop_grace_period: 55s
    environment:
      <<: *app-env
      WORKER_STAGE: housekeeping

  hls-test-page:
    image: nginx:alpine
    profiles:
      - tools
    ports:
      - "8080:80"
    volumes:
      - ../../tools/hls-test-page:/usr/share/nginx/html:ro

  # ---- observability (profile: observability) ---------------------------------
  prometheus:
    image: prom/prometheus:latest
    profiles:
      - observability
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/alerts:/etc/prometheus/rules:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    restart: on-failure

  alertmanager:
    image: prom/alertmanager:latest
    profiles:
      - observability
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    restart: on-failure

  grafana:
    image: grafana/grafana:latest
    profiles:
      - observability
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/dashboards:/var/lib/grafana/dashboards:ro
    restart: on-failure

  tempo:
    image: grafana/tempo:latest
    profiles:
      - observability
    ports:
      - "3200:3200"
      - "4317:4317"
    command:
      - "-config.file=/etc/tempo.yml"
    volumes:
      - ./tempo/tempo.yml:/etc/tempo.yml:ro
    restart: on-failure

  loki:
    image: grafana/loki:latest
    profiles:
      - observability
    ports:
      - "3100:3100"
    command:
      - "-config.file=/etc/loki/local-config.yaml"
    volumes:
      - ./loki/loki.yml:/etc/loki/local-config.yaml:ro
    restart: on-failure

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    profiles:
      - observability
    ports:
      - "4318:4318"
    volumes:
      - ./otel-collector/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - tempo
      - loki
    restart: on-failure

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    profiles:
      - chaos
    ports:
      - "8474:8474"
      - "9002:9002"
    volumes:
      - ./toxiproxy/toxiproxy.json:/etc/toxiproxy.json:ro
    command: ["-host=0.0.0.0", "-config=/etc/toxiproxy.json"]
    restart: on-failure

volumes:
  pgdata:
  redisdata:
  miniodata:

