name: Refresh unit timings

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: refresh-unit-timings
  cancel-in-progress: false

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  refresh:
    name: refresh-unit-timings
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: chore/refresh-unit-timings
      ISSUE_TITLE: Unit timings are ready for a pull request
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace
        with:
          build: 'false'

      - name: Average the spec costs of the last two green CI runs on main
        id: runs
        run: |
          runs=$(gh run list --workflow ci.yml --branch main --event push --status success --limit 2 --json databaseId --jq '.[].databaseId')
          test -n "$runs" || { echo "::error::no successful CI run on main to read"; exit 1; }
          args=()
          for run in $runs; do args+=(--run "$run"); done
          pnpm -s timings:update "${args[@]}"

      - name: Put the new timings on a branch, written through the contents API
        id: branch
        run: |
          if git diff --quiet -- tests/timings/unit.json; then
            echo "tests/timings/unit.json is up to date" >> "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          main_sha=$(git rev-parse HEAD)
          if gh api "repos/$GH_REPO/git/ref/heads/$BRANCH" > /dev/null 2>&1; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/heads/$BRANCH" -f sha="$main_sha" -F force=true > /dev/null
          else
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$main_sha" > /dev/null
          fi
          blob=$(gh api "repos/$GH_REPO/contents/tests/timings/unit.json?ref=$BRANCH" --jq .sha)
          jq -n --arg branch "$BRANCH" --arg blob "$blob" --rawfile file tests/timings/unit.json \
            '{message: "chore: refresh the unit spec timings", branch: $branch, sha: $blob, content: ($file | @base64)}' \
            | gh api --method PUT "repos/$GH_REPO/contents/tests/timings/unit.json" --input - > /dev/null
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open or update the one issue that links the compare view, and close it when the file is current
        env:
          CHANGED: ${{ steps.branch.outputs.changed }}
        run: |
          number=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number,title \
            --jq "map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty")
          if [ "$CHANGED" != true ]; then
            test -z "$number" || gh issue close "$number" --comment "tests/timings/unit.json on main is up to date."
            exit 0
          fi
          {
            echo "Spec costs in tests/timings/unit.json, averaged over the last two green CI runs on main, are on the branch $BRANCH."
            echo
            echo "Open the pull request: https://github.com/$GH_REPO/compare/main...$BRANCH?expand=1"
          } > "$RUNNER_TEMP/issue.md"
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "$ISSUE_TITLE" --body-file "$RUNNER_TEMP/issue.md"
          fi
