name: Flake hunt

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: flake-hunt-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  hunt:
    name: flake-hunt-${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        suite: [web]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace

      - name: Set up FFmpeg
        uses: ./.github/actions/setup-ffmpeg

      - name: Restore or generate the fixtures
        uses: ./.github/actions/video-fixtures
        with:
          only: s2,s15

      - name: Download Chromium
        if: matrix.suite != 'jsdom'
        run: pnpm --filter @vp/${{ matrix.suite }} exec playwright install --only-shell chromium

      - name: Run the flaky specs under CPU load
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/report-1.json
        run: |
          for i in 1 2 3 4; do yes > /dev/null & done
          pnpm --filter @vp/${{ matrix.suite }} exec playwright test e2e/watch-vitals.test.ts --grep 'watch vitals' --repeat-each 40 --retries 0 --trace on --reporter=json

      - name: Keep the round reports and the Playwright results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flake-hunt-${{ matrix.suite }}
          path: |
            ${{ runner.temp }}/report-*.json
            apps/client/*/e2e/test-results/**
            apps/client/*/test-results/**
          if-no-files-found: ignore
          retention-days: 7
