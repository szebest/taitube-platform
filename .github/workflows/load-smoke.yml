name: Load Smoke Test (Nightly & PR)

on:
  schedule:
    - cron: "0 2 * * *" # Nightly at 2am
  pull_request:
    paths:
      - "tests/load/**"
      - "apps/api/**"
      - "apps/worker/**"
      - "packages/server/**"
      - "infra/compose/docker-compose.yml"
      - ".github/workflows/load-smoke.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  load-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Docker Compose Stack
        run: |
          cp .env.example .env
          # The load profile drives far more uploads per user than the production limit allows.
          echo "UPLOAD_RATE_LIMIT_MAX=100000" >> .env
          make up-all

      # Installed from the release tarball: the apt repo needs a keyserver fetch that times out on runners.
      - name: Install k6
        env:
          K6_VERSION: v2.2.0
          K6_SHA256: b5a8003c86f35f5cd5ceef1490312c48e587696c94d998cefc6d7b3b4cb1597d
        run: |
          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 10 -o /tmp/k6.tar.gz \
            "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz"
          echo "${K6_SHA256}  /tmp/k6.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/k6.tar.gz --strip-components=1 -C /usr/local/bin "k6-${K6_VERSION}-linux-amd64/k6"
          k6 version

      - name: Wait for API health
        run: |
          echo "Waiting for API to be healthy..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/healthz > /dev/null 2>&1; then
              echo "API healthy after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "ERROR: API not healthy after 120s"
          docker compose -f infra/compose/docker-compose.yml logs --tail=50
          exit 1

      - name: Run S1 (Reduced for CI)
        env:
          # Pre-baked dev JWT: sub=00000000-0000-7000-8000-000000000001, role=user, exp=2036
          TOKEN: eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCIsImtpZCI6InZwLWRldi1rZXktMSJ9.eyJzdWIiOiIwMDAwMDAwMC0wMDAwLTcwMDAtODAwMC0wMDAwMDAwMDAwMDEiLCJyb2xlIjoidXNlciIsImlzcyI6InZwLWRldiIsImF1ZCI6InZwLWFwaSIsImlhdCI6MTc4OTE0NTQ1NiwiZXhwIjoyMTA0NTA1NDU2fQ.s309zkg-MQ6oDZHunmIfqrvyZgBETHgmuLRtcWsD_1hSZciougdfedfR2s7a2ac-oCnXmJG6TultN5c26_eeDQ
          API: http://localhost:3000
        # --vus/--duration override the script's scenarios block entirely (k6 uses constant-vus instead)
        run: k6 run --vus 5 --duration 1m tests/load/s1-upload-storm.js

      - name: Teardown
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml down -v
