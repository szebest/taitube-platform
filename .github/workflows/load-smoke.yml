name: Load Smoke Test (Nightly & PR)

on:
  schedule:
    - cron: "0 2 * * *" # Nightly at 2am
  pull_request:
    paths:
      - "tests/load/**"
      - "apps/**"
      - "infra/compose/docker-compose.yml"

jobs:
  load-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: npm i -g pnpm && pnpm install

      - name: Start Docker Compose Stack
        run: |
          cp .env.example .env
          # The load profile drives far more uploads per user than the production limit allows.
          echo "UPLOAD_RATE_LIMIT_MAX=100000" >> .env
          make up-all

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Wait for API health
        run: |
          echo "Waiting for API to be healthy..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/healthz > /dev/null 2>&1; then
              echo "API healthy after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "ERROR: API not healthy after 120s"
          docker compose -f infra/compose/docker-compose.yml logs --tail=50
          exit 1

      - name: Run S1 (Reduced for CI)
        env:
          # Pre-baked dev JWT: sub=00000000-0000-7000-8000-000000000001, role=user, exp=2036
          TOKEN: eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCIsImtpZCI6InZwLWRldi1rZXktMSJ9.eyJzdWIiOiIwMDAwMDAwMC0wMDAwLTcwMDAtODAwMC0wMDAwMDAwMDAwMDEiLCJyb2xlIjoidXNlciIsImlzcyI6InZwLWRldiIsImF1ZCI6InZwLWFwaSIsImlhdCI6MTc4OTE0NTQ1NiwiZXhwIjoyMTA0NTA1NDU2fQ.s309zkg-MQ6oDZHunmIfqrvyZgBETHgmuLRtcWsD_1hSZciougdfedfR2s7a2ac-oCnXmJG6TultN5c26_eeDQ
          API: http://localhost:3000
        # --vus/--duration override the script's scenarios block entirely (k6 uses constant-vus instead)
        run: k6 run --vus 5 --duration 1m tests/load/s1-upload-storm.js

      - name: Teardown
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml down -v
