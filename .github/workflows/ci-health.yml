name: CI health

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

concurrency:
  group: ci-health
  cancel-in-progress: false

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  measure:
    name: ci-health
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      checks: read
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE_TITLE: CI health is below its thresholds
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace

      - name: Measure main over its last 50 runs and the last 20 merges
        id: main
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm -s ci:health --branch main --runs 50 --merges --check --json "$RUNNER_TEMP/ci-health-main.json" \
            | tee "$RUNNER_TEMP/ci-health-main.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Measure pull requests over their last 100 runs, with the causes of every failed job
        id: pr
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm -s ci:health --branch pr --runs 100 --causes --check --json "$RUNNER_TEMP/ci-health-pr.json" \
            | tee "$RUNNER_TEMP/ci-health-pr.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep both reports as JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-health
          path: ${{ runner.temp }}/ci-health-*.json
          retention-days: 30

      - name: Open or update the one issue that carries the numbers
        if: steps.main.outcome == 'failure' || steps.pr.outcome == 'failure'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "The nightly CI health run $RUN_URL found a threshold broken."
            echo
            cat "$RUNNER_TEMP/ci-health-main.md" "$RUNNER_TEMP/ci-health-pr.md"
          } > "$RUNNER_TEMP/issue.md"
          number=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number,title \
            --jq "map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "$ISSUE_TITLE" --body-file "$RUNNER_TEMP/issue.md"
          fi

      - name: Fail below the thresholds
        if: steps.main.outcome == 'failure' || steps.pr.outcome == 'failure'
        run: exit 1
