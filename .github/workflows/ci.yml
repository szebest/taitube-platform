name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

# Every job's timeout-minutes is its budget (tests/architecture/ci-shape.test.ts holds them): a job
# that gets slower fails the run instead of waiting for somebody to notice.
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.changes.outputs.code == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect a change CI can affect
        id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'

      - name: Set up the workspace
        if: github.event_name != 'pull_request' || steps.changes.outputs.code == 'true'
        uses: ./.github/actions/setup-workspace

      - name: Build every package once
        if: github.event_name != 'pull_request' || steps.changes.outputs.code == 'true'
        run: pnpm exec turbo run build

      - name: Save the build for the jobs that follow
        if: github.event_name != 'pull_request' || steps.changes.outputs.code == 'true'
        uses: actions/cache/save@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}

  lint-typecheck:
    name: lint-typecheck
    needs: [build]
    if: needs.build.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace

      - name: Set up kustomize
        uses: ./.github/actions/setup-kustomize

      - name: Check package boundaries (tiers, layers, CLAUDE.md symlinks)
        run: pnpm boundaries

      - name: Check architectural invariants
        run: pnpm test:architecture

      - name: Run Biome lint
        run: pnpm lint

      - name: Run TypeScript typecheck
        run: pnpm exec turbo run typecheck

  unit:
    name: unit
    needs: [build]
    if: needs.build.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace
        with:
          bun: 'true'

      - name: Set up FFmpeg
        uses: ./.github/actions/setup-ffmpeg

      - name: Restore or generate the video fixtures
        uses: ./.github/actions/video-fixtures

      - name: Replay the build from the turbo cache
        run: pnpm exec turbo run build

      - name: Run unit tests (Node 24)
        run: pnpm test:unit

  unit-bun:
    name: unit-bun
    needs: [build]
    if: needs.build.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace
        with:
          bun: 'true'

      - name: Set up FFmpeg
        uses: ./.github/actions/setup-ffmpeg

      - name: Restore or generate the video fixtures
        uses: ./.github/actions/video-fixtures

      - name: Replay the build from the turbo cache
        run: pnpm exec turbo run build

      - name: Run worker & packages unit tests under Bun (runtime parity gate)
        run: pnpm test:bun

  integration:
    name: integration
    needs: [build]
    if: needs.build.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start infrastructure services with Docker Compose
        env:
          REDIS_PASSWORD: vp
        run: |
          cp .env.example .env
          docker compose -f infra/compose/docker-compose.yml up -d postgres redis minio

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace
        with:
          bun: 'true'

      - name: Set up FFmpeg
        uses: ./.github/actions/setup-ffmpeg

      - name: Restore or generate the video fixtures
        uses: ./.github/actions/video-fixtures

      - name: Verify video fixtures against manifest
        run: pnpm gen-video --check

      - name: Replay the build from the turbo cache
        run: pnpm exec turbo run build

      - name: Migrate the database and create the buckets
        run: |
          until docker compose -f infra/compose/docker-compose.yml exec -T postgres pg_isready -U vp -d vp; do sleep 1; done
          docker compose -f infra/compose/docker-compose.yml up minio-init
          DATABASE_URL="postgres://vp:vp@localhost:5432/vp" pnpm db:migrate

      - name: Run infrastructure smoke test (infra/compose/test.sh)
        run: bash infra/compose/test.sh

      - name: Run integration tests
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://vp:vp@localhost:5432/vp
          REDIS_URL: redis://localhost:6379
          REDIS_PASSWORD: vp
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin
        run: pnpm test:integration

      - name: Stop infrastructure services
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml down -v --remove-orphans || true

  e2e:
    name: e2e-smoke
    needs: [build]
    if: needs.build.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      COMPOSE: docker compose -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.offline.yml
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the API and worker images side by side from the layer cache
        uses: docker/bake-action@v6
        with:
          source: .
          load: true
          set: |
            api.cache-from=type=gha,scope=api
            api.cache-to=type=gha,scope=api,mode=max
            worker.cache-from=type=gha,scope=worker-bun
            worker.cache-to=type=gha,scope=worker-bun,mode=max

      - name: Start the stack offline (internal network, zero internet egress)
        env:
          REDIS_PASSWORD: vp
        run: |
          cp .env.example .env
          echo "127.0.0.1 minio" | sudo tee -a /etc/hosts
          sudo sysctl -w net.ipv4.conf.all.route_localnet=1 2>/dev/null || true
          sudo iptables -t nat -C POSTROUTING -d 172.16.0.0/12 -s 127.0.0.1 -j MASQUERADE 2>/dev/null || sudo iptables -t nat -A POSTROUTING -d 172.16.0.0/12 -s 127.0.0.1 -j MASQUERADE
          $COMPOSE up -d --no-build

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace
        with:
          bun: 'true'

      - name: Restore or generate the smoke fixture
        uses: ./.github/actions/video-fixtures
        with:
          only: s2

      - name: Wait for the stack and prove it has no egress
        env:
          REDIS_PASSWORD: vp
        run: |
          $COMPOSE up -d --no-build --wait --wait-timeout 90 || { $COMPOSE logs --tail=100; exit 1; }
          $COMPOSE exec -T api curl -s --connect-timeout 2 http://1.1.1.1 >/dev/null 2>&1 && { echo "ERROR: Container reached the internet!"; exit 1; } || echo "Verified: Containers have zero internet egress."

      - name: Run E2E smoke test (validates pipeline correctness under offline mode)
        run: API_URL=http://127.0.0.1:3000 make smoke

      - name: Dump container logs on failure
        if: failure()
        run: $COMPOSE logs --tail=200 || true

      - name: Stop stack
        if: always()
        run: $COMPOSE down -v --remove-orphans || true

  publish-images:
    name: publish-images
    needs: [e2e]
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/images.yml
    secrets: inherit
