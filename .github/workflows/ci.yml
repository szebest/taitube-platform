name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

# Every job's timeout-minutes is its budget (tests/architecture/ci-shape.test.ts holds them): a job
# that gets slower fails the run instead of waiting for somebody to notice.
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.changes.outputs.code == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect a change CI can affect
        id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'

      - name: Set up the workspace
        if: github.event_name != 'pull_request' || steps.changes.outputs.code == 'true'
        uses: ./.github/actions/setup-workspace

      - name: Build every package once
        if: github.event_name != 'pull_request' || steps.changes.outputs.code == 'true'
        run: pnpm exec turbo run build

      - name: Save the build for the jobs that follow
        if: github.event_name != 'pull_request' || steps.changes.outputs.code == 'true'
        uses: actions/cache/save@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}

  lint-typecheck:
    name: lint-typecheck
    needs: [build]
    if: needs.build.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace

      - name: Set up kustomize
        uses: ./.github/actions/setup-kustomize

      - name: Check package boundaries (tiers, layers, CLAUDE.md symlinks)
        run: pnpm boundaries

      - name: Check architectural invariants
        run: pnpm test:architecture --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/architecture.json"

      - name: Read how long the architecture suite took
        id: architecture-time
        run: |
          echo "started=$(jq '.startTime' "$RUNNER_TEMP/architecture.json")" >> "$GITHUB_OUTPUT"
          echo "finished=$(jq '[.testResults[].endTime] | max | floor' "$RUNNER_TEMP/architecture.json")" >> "$GITHUB_OUTPUT"
          jq -r '.startTime as $t0 | .testResults | sort_by(.startTime)[] | "\(.startTime - $t0 | floor) \(.endTime - .startTime | floor) \(.name | split("/") | last)"' "$RUNNER_TEMP/architecture.json"

      - name: Hold the architecture suite to its budget
        uses: ./.github/actions/budget
        with:
          what: test:architecture
          seconds: 6
          started-at: ${{ steps.architecture-time.outputs.started }}
          finished-at: ${{ steps.architecture-time.outputs.finished }}

      - name: Run Biome lint (warnings are errors)
        run: pnpm lint

      - name: Run TypeScript typecheck
        run: pnpm exec turbo run typecheck typecheck:repo

      - name: Find unused files, exports and dependencies (knip)
        run: pnpm knip

      - name: Find exports only specs use (knip --production)
        run: pnpm knip --production

  unit:
    name: unit
    needs: [build]
    if: needs.build.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Start the job's budget
        run: echo "JOB_STARTED_AT=$(date +%s%3N)" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace

      - name: Set up FFmpeg
        uses: ./.github/actions/setup-ffmpeg

      - name: Set up kustomize
        uses: ./.github/actions/setup-kustomize

      - name: Replay the build from the turbo cache
        run: pnpm exec turbo run build

      - name: Restore or generate the video fixtures
        uses: ./.github/actions/video-fixtures

      - name: Restore the last run's spec durations, so the slowest specs start first
        uses: actions/cache@v4
        with:
          path: node_modules/.vite/vitest
          key: vitest-results-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            vitest-results-${{ runner.os }}-

      - name: Run unit tests (Node 24)
        run: pnpm test:unit --pool=threads --maxWorkers=4

      - name: Hold unit to its budget
        uses: ./.github/actions/budget
        with:
          what: unit
          seconds: 150
          started-at: ${{ env.JOB_STARTED_AT }}

  unit-bun:
    name: unit-bun
    needs: [build]
    if: needs.build.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace
        with:
          bun: 'true'

      - name: Set up FFmpeg
        uses: ./.github/actions/setup-ffmpeg

      - name: Set up kustomize
        uses: ./.github/actions/setup-kustomize

      - name: Replay the build from the turbo cache
        run: pnpm exec turbo run build

      - name: Restore or generate the video fixtures
        uses: ./.github/actions/video-fixtures

      - name: Run the api, worker and packages unit tests under Bun (runtime parity gate)
        run: pnpm test:bun

      - name: Run the two suites that once raced a real clock twenty times over
        run: >-
          bun test --timeout 30000 --rerun-each 20
          apps/worker/src/stages/__tests__/segment-uploader.test.ts
          packages/server/adapters/redis/__tests__/redis-reaction-cache.adapter.test.ts

  integration:
    name: integration
    needs: [build]
    if: needs.build.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start infrastructure services with Docker Compose
        env:
          REDIS_PASSWORD: vp
        run: |
          cp .env.example .env
          docker compose -f infra/compose/docker-compose.yml up -d postgres redis minio

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace

      - name: Set up FFmpeg
        uses: ./.github/actions/setup-ffmpeg

      - name: Replay the build from the turbo cache
        run: pnpm exec turbo run build

      - name: Restore or generate the video fixtures
        uses: ./.github/actions/video-fixtures

      - name: Verify video fixtures against manifest
        run: pnpm gen-video --check

      - name: Migrate the database and create the buckets
        run: |
          until docker compose -f infra/compose/docker-compose.yml exec -T postgres pg_isready -U vp -d vp; do sleep 1; done
          docker compose -f infra/compose/docker-compose.yml up minio-init
          DATABASE_URL="postgres://vp:vp@localhost:5432/vp" pnpm db:migrate

      - name: Show the service containers the contract specs run against
        run: docker compose -f infra/compose/docker-compose.yml ps postgres redis minio

      - name: Run infrastructure smoke test (infra/compose/test.sh)
        run: bash infra/compose/test.sh

      - name: Run the FFmpeg specs and the adapter contracts against the real services
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://vp:vp@localhost:5432/vp
          REDIS_URL: redis://localhost:6379
          REDIS_PASSWORD: vp
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin
        run: pnpm test:integration

      - name: Stop infrastructure services
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml down -v --remove-orphans || true

  e2e:
    name: e2e-smoke
    needs: [build]
    if: needs.build.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace

      - name: Replay the build from the turbo cache
        run: pnpm exec turbo run build

      - name: Bundle the API and the worker from that build
        run: |
          scripts/bundle-app.sh api "$RUNNER_TEMP/bundle-api" &
          scripts/bundle-app.sh worker "$RUNNER_TEMP/bundle-worker" &
          wait

      - name: Restore or generate the smoke fixture
        uses: ./.github/actions/video-fixtures
        with:
          only: s2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          cleanup: false

      - name: Build the images around the bundles
        uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6.10.0
        env:
          API_BUNDLE: ${{ runner.temp }}/bundle-api
          WORKER_BUNDLE: ${{ runner.temp }}/bundle-worker
        with:
          source: .
          load: true
          set: |
            api.cache-from=type=gha,scope=api-runtime
            api.cache-to=type=gha,scope=api-runtime,mode=max
            worker.cache-from=type=gha,scope=worker-runtime
            worker.cache-to=type=gha,scope=worker-runtime,mode=max

      - name: Start the stack offline (internal network, zero internet egress)
        env:
          REDIS_PASSWORD: vp
        run: |
          cp .env.example .env
          echo "127.0.0.1 minio" | sudo tee -a /etc/hosts
          sudo sysctl -w net.ipv4.conf.all.route_localnet=1 2>/dev/null || true
          sudo iptables -t nat -C POSTROUTING -d 172.16.0.0/12 -s 127.0.0.1 -j MASQUERADE 2>/dev/null || sudo iptables -t nat -A POSTROUTING -d 172.16.0.0/12 -s 127.0.0.1 -j MASQUERADE
          docker compose -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.offline.yml up -d --no-build

      - name: Wait for the stack and prove it has no egress
        env:
          REDIS_PASSWORD: vp
        run: |
          docker compose -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.offline.yml up -d --no-build --wait --wait-timeout 90 || { docker compose -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.offline.yml logs --tail=100; exit 1; }
          docker compose -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.offline.yml exec -T api curl -s --connect-timeout 2 http://1.1.1.1 >/dev/null 2>&1 && { echo "ERROR: Container reached the internet!"; exit 1; } || echo "Verified: Containers have zero internet egress."

      - name: Run E2E smoke test (validates pipeline correctness under offline mode)
        run: API_URL=http://127.0.0.1:3000 make smoke

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.offline.yml logs --tail=200 || true

  terraform:
    name: terraform
    needs: [build]
    if: needs.build.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CHECKPOINT_DISABLE: 1
      TF_IN_AUTOMATION: 1
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugins
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: ./.github/actions/setup-terraform

      - name: Restore the provider plugins the lock file selects
        uses: actions/cache@v4
        with:
          path: .terraform-plugins
          key: terraform-providers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('infra/terraform/.terraform.lock.hcl') }}

      - name: Check Terraform formatting
        run: terraform -chdir=infra/terraform fmt -check -recursive -diff

      - name: Validate the Terraform configuration without a backend
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terraform -chdir=infra/terraform init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/terraform validate

  publish-images:
    name: publish-images
    needs: [e2e]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    secrets: inherit
