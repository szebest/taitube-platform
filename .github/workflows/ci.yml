name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint-typecheck:
    name: lint-typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-lint-typecheck-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-lint-typecheck-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome lint
        run: pnpm lint

      - name: Run TypeScript typecheck
        run: pnpm typecheck

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (ffmpeg, fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core fontconfig

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Set up Bun 1.4
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-unit-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-unit-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate video fixtures
        run: pnpm gen-video

      - name: Run unit tests (Node 24)
        run: pnpm test

  unit-bun:
    name: unit-bun
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (ffmpeg, fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core fontconfig

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Set up Bun 1.4
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-unit-bun-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-unit-bun-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate video fixtures
        run: pnpm gen-video

      - name: Run worker & packages unit tests under Bun (runtime parity gate)
        run: pnpm test:bun

  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (psql, redis-cli, ffmpeg, curl)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client redis-tools ffmpeg curl fonts-dejavu-core fontconfig

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Set up Bun 1.4
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-integration-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-integration-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate video fixtures
        run: pnpm gen-video

      - name: Verify video fixtures against manifest
        run: pnpm gen-video --check

      - name: Start infrastructure services with Docker Compose
        env:
          REDIS_PASSWORD: vp
        run: |
          cp .env.example .env
          docker compose -f infra/compose/docker-compose.yml up -d postgres redis minio minio-init --wait

      - name: Run infrastructure smoke test (infra/compose/test.sh)
        run: bash infra/compose/test.sh

      - name: Run integration tests
        env:
          NODE_ENV: test
          POSTGRES_URL: postgres://vp:vp@localhost:5432/vp
          REDIS_URL: redis://:vp@localhost:6379
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin
          S3_RAW_BUCKET: raw
          S3_PUBLIC_BUCKET: public
        run: pnpm test:integration

      - name: Stop infrastructure services
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml down -v

  e2e:
    name: e2e-smoke
    runs-on: ubuntu-latest
    needs: [integration]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and start entire stack with Docker Compose
        env:
          REDIS_PASSWORD: vp
        run: |
          cp .env.example .env
          docker compose -f infra/compose/docker-compose.yml up -d --build --wait

      - name: Run E2E smoke test
        run: make smoke

      - name: Run offline smoke test (internal network with zero internet egress)
        run: make smoke-offline

