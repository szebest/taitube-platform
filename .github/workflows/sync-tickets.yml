name: Sync Tickets to GitHub Issues

on:
  push:
    branches:
      - main
    paths:
      - 'docs/tickets/**'
      - 'scripts/sync-tickets-to-github.py'
  workflow_dispatch:

concurrency:
  group: sync-tickets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Sync Tickets to GitHub Issues
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Ticket Sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/sync-tickets-to-github.py

      - name: Commit Updated Issue Links
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add docs/tickets/
            git commit -m "docs(tickets): sync GitHub issue links to local tickets [skip ci]"
            git push origin main
          fi
