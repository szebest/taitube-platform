name: Sync Tickets to GitHub Issues

on:
  push:
    branches:
      - main
    paths:
      - 'docs/tickets/**'
      - 'scripts/sync-tickets-to-github.py'
  workflow_dispatch:

concurrency:
  group: sync-tickets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Sync Tickets to GitHub Issues
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Reads the tickets and writes issues only: main is protected, so the job never pushes to it.
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Ticket Sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/sync-tickets-to-github.py

      - name: Name every ticket still missing its issue link
        run: |
          missing=$(git diff --name-only -- docs/tickets)
          if [ -z "$missing" ]; then
            echo "Every ticket links its issue." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "These tickets have an issue but no \`| Issue |\` row. Run \`pnpm sync:tickets\` on a branch and commit the rows:"
            echo
            git diff -- docs/tickets | grep '^+| Issue |' || true
          } >> "$GITHUB_STEP_SUMMARY"
          for file in $missing; do
            echo "::warning file=$file::no issue link row; pnpm sync:tickets on a branch writes it"
          done
