name: Images

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      push:
        description: Push the scanned images to GHCR
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  PUSH: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.push == true }}

jobs:
  build-and-push:
    name: build-and-push-${{ matrix.image.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: api
            repository: ghcr.io/szebest/vp-api
            file: apps/api/Dockerfile
            runtime: ''
            suffix: ''
          - name: worker-bun
            repository: ghcr.io/szebest/vp-worker
            file: apps/worker/Dockerfile
            runtime: bun
            suffix: ''
          - name: worker-node
            repository: ghcr.io/szebest/vp-worker
            file: apps/worker/Dockerfile
            runtime: node
            suffix: -node
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image.repository }}
          flavor: |
            suffix=${{ matrix.image.suffix }}
          tags: |
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && matrix.image.suffix == '' }}
            type=raw,value=node,enable=${{ startsWith(github.ref, 'refs/tags/v') && matrix.image.suffix == '-node' }}

      - name: Build the amd64 image for the scan
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.file }}
          build-args: |
            WORKER_RUNTIME=${{ matrix.image.runtime }}
          platforms: linux/amd64
          load: true
          tags: scan/${{ matrix.image.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max

      - name: Fail on a HIGH or CRITICAL finding that has a fix
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan/${{ matrix.image.name }}:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Build and push (linux/amd64, linux/arm64)
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.file }}
          build-args: |
            WORKER_RUNTIME=${{ matrix.image.runtime }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max
