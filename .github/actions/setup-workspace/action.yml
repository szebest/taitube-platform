name: Set up the workspace
description: pnpm, Node 24 and optionally Bun, the locked install, and the build the `build` job left in the turbo cache for this commit.

inputs:
  bun:
    description: Install Bun 1.4 as well
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up Bun 1.4
      if: inputs.bun == 'true'
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.2

    - name: Set up pnpm and Node.js, and install the locked dependencies
      uses: pnpm/setup@v3
      with:
        node-version-file: .nvmrc
        cache: true
        require-lockfile: true

    - name: Restore the turbo cache
      uses: actions/cache/restore@v6
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-
