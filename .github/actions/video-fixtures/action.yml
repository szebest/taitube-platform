name: Video fixtures
description: The generated test videos, cached on the generator's source and manifest; FFmpeg is set up only when they have to be generated again.

inputs:
  only:
    description: The comma-separated fixture ids a job reads; empty for the whole fast set
    default: ''

runs:
  using: composite
  steps:
    - name: Name the cache after the fixture set, which a cache key cannot spell with commas
      id: set
      shell: bash
      env:
        ONLY: ${{ inputs.only }}
      run: echo "name=${ONLY:-all}" | tr ',' '+' >> "$GITHUB_OUTPUT"

    - name: Restore the fixtures
      id: cache
      uses: actions/cache@v4
      with:
        path: tests/fixtures
        key: fixtures-${{ steps.set.outputs.name }}-${{ hashFiles('packages/server/gen-video/src/**', '!packages/server/gen-video/src/__tests__/**', 'packages/server/gen-video/manifest.json') }}

    - name: Set up FFmpeg
      if: steps.cache.outputs.cache-hit != 'true'
      uses: ./.github/actions/setup-ffmpeg

    - name: Generate the fixtures
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        ONLY: ${{ inputs.only }}
      run: pnpm gen-video ${ONLY:+--only "$ONLY"}
