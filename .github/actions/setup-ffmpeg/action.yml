name: Set up FFmpeg
description: FFmpeg and the fonts its drawtext filter needs, restored from the apt package cache instead of downloaded on every run.

runs:
  using: composite
  steps:
    - name: Install FFmpeg and fonts from the apt cache
      uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
      with:
        packages: ffmpeg fonts-dejavu-core fontconfig
        version: '1'
