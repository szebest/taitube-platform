name: Set up FFmpeg
description: FFmpeg and the fonts its drawtext filter needs, from apt with the man-db trigger off (it is most of the install time).

runs:
  using: composite
  steps:
    - name: Install FFmpeg and fonts
      shell: bash
      run: |
        sudo rm -f /var/lib/man-db/auto-update
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core fontconfig
