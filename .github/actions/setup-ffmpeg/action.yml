name: Set up FFmpeg
description: Ubuntu's FFmpeg and the fonts its drawtext filter needs, installed from .deb files cached per runner image.

runs:
  using: composite
  steps:
    - name: Restore the FFmpeg packages
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/ffmpeg-debs
        key: ffmpeg-debs-${{ env.ImageOS }}-${{ env.ImageVersion }}

    - name: Download the FFmpeg packages
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        sudo rm -f /var/lib/man-db/auto-update
        sudo apt-get update -qq
        sudo apt-get install -y -qq --download-only --no-install-recommends ffmpeg fonts-dejavu-core fontconfig
        mkdir -p ~/ffmpeg-debs
        cp /var/cache/apt/archives/*.deb ~/ffmpeg-debs/

    - name: Install FFmpeg and fonts
      shell: bash
      run: |
        sudo rm -f /var/lib/man-db/auto-update
        sudo dpkg -i ~/ffmpeg-debs/*.deb > /dev/null
        ffmpeg -hide_banner -version | head -1
