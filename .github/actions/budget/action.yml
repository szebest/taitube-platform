name: Budget
description: Fails the job when the step it names took longer than its budget, from started-at to finished-at.

inputs:
  step:
    description: The id of the step the budget measures, as the error names it
    required: true
  seconds:
    description: The budget
    required: true
  started-at:
    description: Epoch milliseconds
    required: true
  finished-at:
    description: Epoch milliseconds, now when empty
    default: ''

runs:
  using: composite
  steps:
    - name: Hold ${{ inputs.step }} to ${{ inputs.seconds }} s
      shell: bash
      env:
        STEP: ${{ inputs.step }}
        BUDGET_SECONDS: ${{ inputs.seconds }}
        STARTED_AT: ${{ inputs.started-at }}
        FINISHED_AT: ${{ inputs.finished-at }}
      run: |
        finished_at="${FINISHED_AT:-$(date +%s%3N)}"
        elapsed_ms=$((finished_at - STARTED_AT))
        budget_ms=$((BUDGET_SECONDS * 1000))
        echo "$STEP took ${elapsed_ms} ms of its ${budget_ms} ms budget"
        if [ "$elapsed_ms" -gt "$budget_ms" ]; then
          echo "::error::$STEP took ${elapsed_ms} ms, over its ${BUDGET_SECONDS} s budget"
          exit 1
        fi
