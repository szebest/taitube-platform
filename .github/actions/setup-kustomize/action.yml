name: Set up kustomize
description: Installs the pinned, checksum-verified kustomize the production-secrets assertion renders the overlays with, cached by version and arch.

runs:
  using: composite
  steps:
    - name: Resolve release
      id: release
      shell: bash
      env:
        RUNNER_ARCH: ${{ runner.arch }}
      run: |
        version=v5.8.3
        case "$RUNNER_ARCH" in
          X64) arch=amd64; sha256=cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61 ;;
          ARM64) arch=arm64; sha256=9867b76482cfc6d25b546abc1d2b5a32bd137505aba640649b4b378f64f6d68f ;;
          *) echo "::error::no pinned kustomize for runner arch $RUNNER_ARCH"; exit 1 ;;
        esac
        {
          echo "version=$version"
          echo "arch=$arch"
          echo "sha256=$sha256"
        } >> "$GITHUB_OUTPUT"

    - name: Restore kustomize
      id: cache
      uses: actions/cache@v6
      with:
        path: ~/.local/kustomize
        key: kustomize-${{ steps.release.outputs.version }}-linux-${{ steps.release.outputs.arch }}-${{ steps.release.outputs.sha256 }}

    - name: Download and verify kustomize
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ steps.release.outputs.version }}
        ARCH: ${{ steps.release.outputs.arch }}
        SHA256: ${{ steps.release.outputs.sha256 }}
      run: |
        archive="kustomize_${VERSION}_linux_${ARCH}.tar.gz"
        curl -fsSL -o "$RUNNER_TEMP/$archive" \
          "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${VERSION}/${archive}"
        echo "${SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
        mkdir -p ~/.local/kustomize
        tar -xzf "$RUNNER_TEMP/$archive" -C ~/.local/kustomize kustomize

    - name: Put kustomize on PATH
      shell: bash
      run: echo "$HOME/.local/kustomize" >> "$GITHUB_PATH"
