name: Set up kustomize
description: Installs the pinned kustomize the production-secrets assertion renders the overlays with, cached by version.

inputs:
  version:
    description: kustomize release
    default: v5.8.1

runs:
  using: composite
  steps:
    - name: Restore kustomize
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.local/kustomize
        key: kustomize-${{ inputs.version }}-${{ runner.os }}-${{ runner.arch }}

    - name: Download kustomize
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        mkdir -p ~/.local/kustomize
        curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${VERSION}/kustomize_${VERSION}_linux_amd64.tar.gz" \
          | tar -xz -C ~/.local/kustomize kustomize

    - name: Put kustomize on PATH
      shell: bash
      run: echo "$HOME/.local/kustomize" >> "$GITHUB_PATH"
